name: Publish LKCT Wallet Android 1.2-rc4
on:
  push:
    branches: [wallet-release/android-v1.2-rc4]
    paths: [.github/workflows/lkct-wallet-android-rc4.yml, docs/releases/android-1.2-rc4.md, docs/releases/LKCT-Wallet-v1.2-rc4-Android-SHA256SUMS.txt]
permissions:
  contents: read
concurrency:
  group: lkct-wallet-android-rc4-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GH_REPO: Fussy91Czc/Lajkto-Coin-LKCT
      TAG: v1.2-android-rc4
      TRACK_R7: LKCT-Wallet-v1.2-rc4-Android-arm64-from-R7-R8-R8a.apk
      TRACK_SEPTEMBER: LKCT-Wallet-v1.2-rc4-Android-arm64-from-20260922.apk
      CHECKSUMS: LKCT-Wallet-v1.2-rc4-Android-SHA256SUMS.txt
    steps:
      - name: Verify both published Android packages
        shell: bash
        run: |
          set -euo pipefail
          git init -q
          git fetch -q --depth=1 "https://github.com/$GH_REPO.git" "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git show "FETCH_HEAD:docs/releases/android-1.2-rc4.md" > notes.md
          git show "FETCH_HEAD:docs/releases/$CHECKSUMS" > "$CHECKSUMS"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for apk in "$TRACK_R7" "$TRACK_SEPTEMBER"; do
            curl --fail --silent --show-error --retry 3 --proto '=https' -o "$apk" "https://lajkto.eu/lkct/downloads/$apk"
          done
          sha256sum --check --strict "$CHECKSUMS"
          check_android() {
            local apk="$1" expected="$2"
            "$build_tools/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$apk" > signer.txt
            grep -Fxq 'Verified using v2 scheme (APK Signature Scheme v2): true' signer.txt
            test "$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' signer.txt)" = "$expected"
            "$build_tools/aapt" dump badging "$apk" > badging.txt
            grep -Fq "package: name='eu.lajkto.lkctwallet' versionCode='17' versionName='1.2-rc4'" badging.txt
            grep -Fq "'arm64-v8a'" badging.txt
          }
          check_android "$TRACK_R7" 1b3d41701d48947aa30fd6a95e691bb71146189b5a8f2ab48f684e75e50f071b
          check_android "$TRACK_SEPTEMBER" 990ff433d9abbc0b4a519ff924b23a40d493a8dc93f93e668696b96975e4ace1
      - name: Publish the verified packages as a prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          release_id="$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' releases.json)"
          if [[ -z "$release_id" ]]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title 'LKCT Wallet for Android 1.2-rc4' --notes-file notes.md
            gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
            release_id="$(jq -er --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' releases.json)"
          fi
          gh api "repos/$GH_REPO/releases/$release_id" > release.json
          jq -e --arg commit "$GITHUB_SHA" '.prerelease and .target_commitish == $commit' release.json >/dev/null
          draft="$(jq -r .draft release.json)"
          for asset in "$TRACK_R7" "$TRACK_SEPTEMBER" "$CHECKSUMS"; do
            gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" > assets.json
            id="$(jq -r --arg name "$asset" '.[] | select(.name == $name) | .id' assets.json)"
            if [[ -z "$id" ]]; then
              test "$draft" = true
              curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header 'Content-Type: application/octet-stream' --data-binary "@$asset" "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$asset" > uploaded.json
              id="$(jq -er .id uploaded.json)"
            fi
            gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$id" > mirror-copy
            cmp "$asset" mirror-copy
          done
          if [[ "$draft" == true ]]; then
            gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -F prerelease=true -f make_latest=false > release.json
          fi
          jq -e '.prerelease and (.draft | not)' release.json >/dev/null
